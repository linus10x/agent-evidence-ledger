[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-ledger"
version = "0.1.0"
description = "Tamper-evident, append-only ledger of agent decisions with a forgery-class-naming verifier."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
